# Smithery configuration file: https://smithery.ai/docs/config
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - dropspotApiKey
    properties:
      dropspotApiKey:
        type: string
        description: "Your Drop Spot API key (format: ds_live_... or ds_test_...)"
      baseUrl:
        type: string
        description: "Drop Spot API base URL"
        default: "https://portal.godropspot.com"
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['-y', '@dropspot/mcp'],
      env: {
        DROPSPOT_API_KEY: config.dropspotApiKey,
        DROPSPOT_API_BASE_URL: config.baseUrl || 'https://portal.godropspot.com'
      }
    })
  exampleConfig:
    dropspotApiKey: "ds_live_abcdef1234567890"
    baseUrl: "https://portal.godropspot.com"
